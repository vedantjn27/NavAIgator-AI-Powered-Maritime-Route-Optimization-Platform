<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="900" height="90">
  <defs>
    <linearGradient id="taggrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#fbbf24"/>
      <stop offset="50%"  style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="linegrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#38bdf8;stop-opacity:0"/>
      <stop offset="50%"  style="stop-color:#2563eb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0"/>
    </linearGradient>
    <filter id="tagglow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="90" fill="#0a1628" rx="12"/>

  <!-- Animated top line -->
  <rect x="0" y="0" width="900" height="2" fill="url(#linegrad)" rx="1">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Anchor icon (pulsing) -->
  <text x="450" y="40"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="20"
        text-anchor="middle"
        fill="#2563eb"
        filter="url(#tagglow)">
    ⚓
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- Tagline text (pulsing glow) -->
  <text x="450" y="65"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="20"
        font-weight="700"
        text-anchor="middle"
        fill="url(#taggrad)"
        filter="url(#tagglow)"
        letter-spacing="3">
    Intelligence That Knows the Way
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Sub-tagline -->
  <text x="450" y="82"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="10"
        text-anchor="middle"
        fill="#475569"
        letter-spacing="2">
    NavAIgator · AI-Powered Maritime Route Optimization
  </text>

  <!-- Animated bottom line -->
  <rect x="0" y="88" width="900" height="2" fill="url(#linegrad)" rx="1">
    <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
